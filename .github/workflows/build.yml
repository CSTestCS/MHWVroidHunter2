name: Build VRoidHunter.exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pyinstaller==6.11.1
      - run: python -m pytest -q
      - name: Build single-file exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name VRoidHunter
          --add-data "vroidhunter/data;vroidhunter/data"
          --collect-submodules vroidhunter
          run_vroidhunter.py
      - name: Smoke test the exe
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\VRoidHunter.exe -ArgumentList "--help" -PassThru
          $ok = $p.WaitForExit(90000)
          if (-not $ok) { $p.Kill() }
          if (Test-Path dist\VRoidHunter.log) { Get-Content dist\VRoidHunter.log } else { Write-Host "no log file" }
          if (-not $ok) { Write-Error "exe did not exit"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "exit code $($p.ExitCode)"; exit 1 }
          if (-not (Select-String -Path dist\VRoidHunter.log -Pattern "usage" -Quiet)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: VRoidHunter
          path: |
            dist/VRoidHunter.exe
            README.md
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VRoidHunter.exe
