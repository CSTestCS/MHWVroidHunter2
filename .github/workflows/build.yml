name: Build VRoidHunter.exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pyinstaller==6.11.1
      - run: python -m pytest -q
      - name: Build single-file exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name VRoidHunter
          --add-data "vroidhunter/data;vroidhunter/data"
          --collect-submodules vroidhunter
          run_vroidhunter.py
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\VRoidHunter.exe -ArgumentList "--help" -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: VRoidHunter
          path: |
            dist/VRoidHunter.exe
            README.md
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VRoidHunter.exe
